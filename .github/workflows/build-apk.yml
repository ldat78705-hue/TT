name: Build APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --warning-mode=all

      - name: Build Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --warning-mode=all
        continue-on-error: true

      - name: Rename APKs
        run: |
          mkdir -p release-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apks/EduCenterPro-${{ github.ref_name }}.apk
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk release-apks/EduCenterPro-${{ github.ref_name }}-release.apk
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          body: |
            ## 📱 EduCenter Pro ${{ github.ref_name }}
            
            ### 📥 Tải & cài đặt:
            1. Bấm vào file **EduCenterPro-${{ github.ref_name }}.apk** bên dưới
            2. Mở file vừa tải → Bấm **Cài đặt**
            3. Mở app → Đăng nhập
            
            > ⚠️ Lần đầu cần cho phép "Cài từ nguồn không xác định"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
