name: Build APK

on:
  push:
    tags:
      - 'v*'  # Chỉ build khi tạo tag version (v1.0, v1.1, ...)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          body: |
            ## 📱 EduCenter Pro ${{ github.ref_name }}
            
            ### Tải xuống:
            - **app-debug.apk** - Bản debug (khuyên dùng)
            - **app-release-unsigned.apk** - Bản release
            
            ### Cài đặt:
            1. Tải file APK về điện thoại
            2. Mở file → Cho phép cài đặt → Xong!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
